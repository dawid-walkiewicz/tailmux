name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: builds for every GOOS we claim
        run: |
          for os in linux freebsd; do GOOS=$os go build ./... ; done
      # Not golang/govulncheck-action: its own setup-go ignores go.mod's
      # toolchain line and scans the older Go.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Each package runs its own set of in-process tailnets; one package at
      # a time keeps small runners from starving WireGuard handshakes.
      - name: unit + end-to-end (three in-process tailnets)
        run: go test -race -p 1 -count=1 -timeout 20m ./...

  # Proxy-free mode against the real OS: a TUN device, kernel routes and
  # the system resolver (systemd-resolved).
  tun-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -c -o tun.test ./internal/tun
      - name: TestSystem as root
        run: sudo TAILMUX_TUN_E2E=1 TAILMUX_TUN_E2E_REQUIRE_DNS=1 ./tun.test -test.run 'TestSystem|TestBypassRules' -test.v -test.timeout 10m
      - name: nothing left behind
        if: always()
        run: if ip link show tailmux0 2>/dev/null; then exit 1; fi

  # `tailmux service install` for real, with systemd. The service must
  # come up, answer on its API with the starter config's tailnets, run TUN
  # mode, and uninstall cleanly.
  service:
    runs-on: ubuntu-latest
    env:
      TOKEN_FILE: /etc/tailmux/api-token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: go build -ldflags "-X main.version=0.0.0-ci" -o out/tailmux ./cmd/tailmux
      - name: install
        run: sudo out/tailmux service install
      - name: running, answering, in TUN mode
        run: |
          # install hands the API token to whoever ran it (sudo's user).
          tok=$(cat "$TOKEN_FILE")
          # The API answers before TUN is up; wait for the interface.
          for _ in $(seq 1 90); do
            curl -sf -H "X-Tailmux: $tok" http://127.0.0.1:1056/status > status.json && grep -q '"interface"' status.json && break
            sleep 1
          done
          # Without the token, or under a page's own domain name: refused.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1056/status)" = 401 ] || { echo "API answered without the token"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Tailmux: $tok" -H 'Host: evil.example:1056' http://127.0.0.1:1056/status)" = 421 ] || { echo "API answered a rebound Host"; exit 1; }
          cat status.json
          for n in work home lab; do grep -q "\"name\": \"$n\"" status.json || { echo "tailnet $n missing"; exit 1; }; done
          grep -q '"interface"' status.json || { echo "TUN mode is not up"; exit 1; }
          out/tailmux service status
      - name: service log
        if: failure()
        run: |
          curl -sf -H "X-Tailmux: $(cat "$TOKEN_FILE")" "http://127.0.0.1:1056/logs?n=200" | tr ',' '\n' | tail -80 || true
      - name: uninstall
        if: always()
        run: |
          sudo out/tailmux service uninstall
          if curl -sf --max-time 3 -o /dev/null http://127.0.0.1:1056/proxy.pac; then echo "still running after uninstall"; exit 1; fi

  # The headless packages GoReleaser builds, installed on the distros they
  # are for, and `make` / the PKGBUILD's build from source on two of them.
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst

  linux-distros:
    needs: linux-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable
            install: apt-get update && apt-get install -y ./pkgs/tailmux-cli_*_linux_amd64.deb
          - image: fedora:latest
            install: dnf install -y ./pkgs/tailmux-cli_*_linux_amd64.rpm
            source: dnf install -y golang make git
          - image: alpine:latest
            install: apk add --allow-untrusted ./pkgs/tailmux-cli_*_linux_amd64.apk
          - image: archlinux:latest
            # pacman's download sandbox doesn't work in every container
            install: sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf && pacman -Sy --noconfirm && pacman -U --noconfirm ./pkgs/tailmux-cli_*_linux_amd64.pkg.tar.zst
            source: pacman -S --noconfirm go make git
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: pkgs
      - name: install the package
        run: ${{ matrix.install }}
      - name: it runs
        run: |
          tailmux version
          tailmux example-config > /tmp/config.json
          command -v ip
      - uses: actions/checkout@v7
        if: matrix.source
        with:
          fetch-depth: 0
      - name: make && make install
        if: matrix.source
        run: |
          ${{ matrix.source }}
          git config --global --add safe.directory "$PWD"
          make
          make install DESTDIR=/tmp/root PREFIX=/usr/local
          /tmp/root/usr/local/bin/tailmux version

  # The Linux desktop app, built on Fedora like the release: the .rpm, its
  # API tests and screenshots against a live daemon, and a screenshot of
  # the real app.
  desktop:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: build deps
        run: >-
          dnf install -y git gcc gcc-c++ make rust cargo file
          webkit2gtk4.1-devel libappindicator-gtk3-devel librsvg2-devel openssl-devel libxdo-devel
          xorg-x11-server-Xvfb ImageMagick dbus-daemon
          nss alsa-lib cups-libs mesa-libgbm libXcomposite libXdamage libXrandr
      - uses: actions/checkout@v7
      # The checkout belongs to the runner's user, not the container's
      # root, and git (so go build's VCS stamp) refuses it otherwise.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: service binary as the sidecar
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          go build -ldflags "-X main.version=0.0.0-ci" -o "desktop/src-tauri/binaries/tailmux-$triple" ./cmd/tailmux
          cp "desktop/src-tauri/binaries/tailmux-$triple" tailmux
      - name: check and bundle
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm tauri build --bundles rpm
      - name: start lab tailnets and daemon
        run: |
          TAILMUX_LAB="$PWD/lab.json" go test ./internal/mux -run TestLab -timeout 0 > lab.log 2>&1 &
          for _ in $(seq 1 120); do [ -f lab.json.ready ] && break; sleep 2; done
          ./tailmux up -config lab.json > up.log 2>&1 &
          # The daemon writes its API token next to the config.
          for _ in $(seq 1 30); do [ -s api-token ] && break; sleep 1; done
          tok=$(cat api-token)
          # The API answers before the tailnets connect; wait for all three.
          for _ in $(seq 1 120); do
            [ "$(curl -sf -H "X-Tailmux: $tok" http://127.0.0.1:21056/status | grep -c '"state": "Running"')" = 3 ] && break
            sleep 1
          done
          curl -sf -H "X-Tailmux: $tok" http://127.0.0.1:21056/status
          for n in alpha bravo charlie; do curl -sf --retry 10 --retry-all-errors --socks5-hostname 127.0.0.1:21055 "http://web.$n/?bytes=3000000" > /dev/null; done
          # Keep traffic flowing so the charts in the screenshots have lines.
          (
            for i in $(seq 1 900); do
              for n in alpha bravo charlie; do
                curl -s --socks5-hostname 127.0.0.1:21055 "http://web.$n/?bytes=$(( (i % 5 + 1) * 150000 ))" > /dev/null &
              done
              sleep 1
            done
          ) &
      - name: app API tests against the daemon
        working-directory: desktop/src-tauri
        env:
          TAILMUX_API: http://127.0.0.1:21056
          # The apps find the API token next to this config.
          TAILMUX_CONFIG: ${{ github.workspace }}/lab.json
        # Own target dir: a plain cargo build of the release binary would
        # replace the bundled one (built with the frontend embedded) with a
        # dev build that loads localhost:1420.
        run: cargo test --release --test api --target-dir target/api-tests
      - name: screenshots of every view
        working-directory: desktop
        env:
          TAILMUX_API: http://127.0.0.1:21056
          # The apps find the API token next to this config.
          TAILMUX_CONFIG: ${{ github.workspace }}/lab.json
        # --with-deps only knows apt; the libraries come from dnf above.
        run: |
          pnpm exec playwright install chromium
          pnpm screenshot --out ../shots
      - name: screenshot and startup check of the real app
        env:
          TAILMUX_API: http://127.0.0.1:21056
          # The apps find the API token next to this config.
          TAILMUX_CONFIG: ${{ github.workspace }}/lab.json
          # WebKit's bubblewrap sandbox can't start inside a container.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
            scripts/ci-app-screenshot-linux.sh desktop/src-tauri/target/release/tailmux-desktop shots/native-linux.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-Linux
          path: |
            shots/
            *.log
            desktop/src-tauri/target/release/bundle/rpm/*.rpm

  # Removing the .rpm must take the service with it, or it keeps holding
  # TUN and DNS with nothing left to stop it. That needs systemd, so a
  # Fedora container booted into it rather than a job container.
  desktop-uninstall:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-Linux
          path: art
      - name: Fedora with systemd
        run: |
          docker run --name setup fedora:latest dnf install -y systemd
          docker commit setup fedora-systemd
          docker run -d --name fed --privileged -v "$PWD/art:/art:ro" fedora-systemd /usr/sbin/init
          docker exec fed systemctl is-system-running --wait || true
      - name: removing the rpm removes the service
        run: |
          rpm=$(find art -name '*.rpm' | head -1)
          docker exec fed dnf install -y "/$rpm"
          docker exec fed /usr/bin/tailmux service install
          docker exec fed test -f /etc/systemd/system/tailmux.service
          docker exec fed sh -c "dnf remove -y \$(rpm -qp --qf '%{NAME}' /$rpm)"
          if docker exec fed test -f /etc/systemd/system/tailmux.service || docker exec fed systemctl is-active -q tailmux; then
            echo "service left behind by the rpm"; exit 1
          fi
          echo "rpm: service removed"

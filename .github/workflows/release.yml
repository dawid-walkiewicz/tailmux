name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -p 1 -count=1 -timeout 20m ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Linux desktop app as an .rpm, built on Fedora, with the service
  # bundled inside, attached to the release.
  desktop:
    needs: binaries
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: build deps
        run: dnf install -y git gcc gcc-c++ make rust cargo webkit2gtk4.1-devel libappindicator-gtk3-devel librsvg2-devel openssl-devel libxdo-devel file gh
      - uses: actions/checkout@v7
      # The checkout belongs to the runner's user, not the container's
      # root, and git (so go build's VCS stamp) refuses it otherwise.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: service binary as the sidecar
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "desktop/src-tauri/binaries/tailmux-$triple" ./cmd/tailmux
      - name: bundle
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles rpm --config "{\"version\":\"${GITHUB_REF_NAME#v}\"}"
      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la desktop/src-tauri/target/release/bundle/rpm/*.rpm
          gh release upload "$GITHUB_REF_NAME" desktop/src-tauri/target/release/bundle/rpm/*.rpm --clobber
